name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize]

jobs:
  # Responds when @claude is mentioned in issues, PR comments, or reviews
  claude-mention:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # Automatically reviews every PR when opened or updated
  claude-pr-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          direct_prompt: |
            Please review this pull request for the json-logger Mule 4 connector. Check for:

            - Code correctness and logic errors
            - Potential bugs or edge cases
            - Security issues (especially in JsonMasker.java and external destination classes)
            - If JSON schemas in src/main/resources/schema/ were changed, verify the corresponding
              generated POJOs are consistent (remind to run `mvn -f json-logger/pom.xml generate-sources`)
            - If pom.xml was modified, verify dependency changes are compatible with the minimum
              supported Mule runtime (4.3.0+)
            - If DataWeave .dwl files were changed, confirm the functions are covered in test-mule-config.xml
            - If files under destinations/ were changed, check that the logic is consistent across
              JMS, AMQP, and Anypoint MQ implementations

            Provide constructive feedback as a PR review comment.
